name: Raqmana Autonomous SEO Autopilot

on:
  schedule:
    # Runs automatically every day at 08:00 AM UTC (09:00 AM Algerian Time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab if ever needed

permissions:
  contents: write

jobs:
  seo-autopilot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute SEO Radar & IndexNow Verification
        run: npm run autopilot

      - name: Verify IndexNow Key Status
        run: |
          if [ -f "public/raqmana2026indexnowkey789.txt" ]; then
            echo "IndexNow Key File OK"
          else
            echo "IndexNow Key File missing!"
            exit 1
          fi


