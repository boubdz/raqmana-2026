name: Raqmana Autonomous SEO Autopilot

on:
  schedule:
    # Runs automatically every day at 08:00 AM UTC (09:00 AM Algerian Time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab if ever needed

jobs:
  seo-autopilot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Autonomous SEO Autopilot Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run autopilot

      - name: Commit and Push Autopilot Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Raqmana Autopilot Bot"
          git config --global user.email "bot@www.raqmanadz.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto(seo): daily autonomous content & instant indexing trigger"
            git push
          else
            echo "No new changes to commit today."
          fi
