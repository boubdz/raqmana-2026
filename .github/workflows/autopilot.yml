name: 🤖 Raqmana News & Trends Autopilot

on:
  # ⏸ الجدولة التلقائية موقوفة مؤقتاً — يعمل يدوياً فقط
  # schedule:
  #   - cron: '0 */3 * * *'
  #   - cron: '0 8,11,14,17,20,23 * * *'
  #   - cron: '0 2 * * *'

  # تشغيل يدوي مخصص من واجهة GitHub Actions
  workflow_dispatch:
    inputs:
      job_type:
        description: 'نوع المهمة المراد تشغيلها فوراً'
        required: true
        default: 'trends'
        type: choice
        options:
          - 'official'
          - 'trends'
          - 'daily_tier2'
          - 'jobs'
          - 'all'

# منع تعارض التشغيل المتزامن
concurrency:
  group: raqmana-autopilot
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1 — رادار الترندات والإعلام الجزائري (Google Trends + Media)
  # ════════════════════════════════════════════════════════════
  trends-radar:
    name: '🔥 رادار الترندات والإعلام الجزائري'
    runs-on: ubuntu-latest

    # تشغيل عند Cron 2 أو يدوياً بـ trends أو all
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'trends' || github.event.inputs.job_type == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 8,11,14,17,20,23 * * *')

    steps:
      - name: '📥 Checkout المستودع'
        uses: actions/checkout@v4

      - name: '🟢 إعداد Node.js 20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: '📦 تثبيت التبعيات'
        run: npm ci --prefer-offline

      - name: '📦 تثبيت تبعيات الرادار'
        run: npm install --no-save rss-parser cheerio axios google-trends-api

      - name: '🔥 تشغيل رادار الترندات وصيد الأخبار'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          NODE_ENV: production
        run: node scripts/news-automation/trends-radar-worker.js

      - name: '📡 تشغيل محرك الفهرسة'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NODE_ENV: production
        run: node scripts/news-automation/indexing-process.js

      - name: '💾 حفظ ونشر المقالات في Git'
        run: |
          git config user.name "Raqmana News Bot"
          git config user.email "bot@raqmanadz.com"
          git add lib/custom-articles-data.json public/auto-news-sitemap.xml scripts/news-automation/history.json || true
          git diff --staged --quiet || git commit -m "🔥 auto: Trending articles $(date +'%Y-%m-%d %H:%M')"
          git push || echo "لا توجد تغييرات لرفعها"

  # ════════════════════════════════════════════════════════════
  # JOB 2 — الأخبار الحكومية الرسمية (كل ساعة)
  # ════════════════════════════════════════════════════════════
  official-news:
    name: '🏛 الأخبار الحكومية الرسمية (كل ساعة)'
    runs-on: ubuntu-latest

    # تشغيل عند Cron 1 أو يدوياً بـ official أو all
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'official' || github.event.inputs.job_type == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 */3 * * *')

    steps:
      - name: '📥 Checkout المستودع'
        uses: actions/checkout@v4

      - name: '🟢 إعداد Node.js 20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: '📦 تثبيت التبعيات'
        run: npm ci --prefer-offline

      - name: '📦 تثبيت تبعيات الأخبار'
        run: npm install --no-save rss-parser cheerio axios

      - name: '🤖 تشغيل محرك الأخبار الرسمية — Tier 1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          NODE_ENV: production
        run: node scripts/news-automation/auto-news-worker.js

      - name: '📡 تشغيل محرك الفهرسة'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NODE_ENV: production
        run: node scripts/news-automation/indexing-process.js

      - name: '💾 حفظ ونشر المقالات في Git'
        run: |
          git config user.name "Raqmana News Bot"
          git config user.email "bot@raqmanadz.com"
          git add lib/custom-articles-data.json public/auto-news-sitemap.xml scripts/news-automation/history.json || true
          git diff --staged --quiet || git commit -m "🏛 auto: Official news articles $(date +'%Y-%m-%d %H:%M')"
          git push || echo "لا توجد تغييرات لرفعها"

  # ════════════════════════════════════════════════════════════
  # JOB 3 — المواقع الحكومية اليومية Tier 2 (يومياً 3:00 ص)
  # ════════════════════════════════════════════════════════════
  daily-tier2:
    name: '🌙 المواقع الحكومية الثانوية (يومياً 3:00 ص)'
    runs-on: ubuntu-latest

    # تشغيل عند Cron 3 أو يدوياً بـ daily_tier2 أو all
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'daily_tier2' || github.event.inputs.job_type == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')

    steps:
      - name: '📥 Checkout المستودع'
        uses: actions/checkout@v4

      - name: '🟢 إعداد Node.js 20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: '📦 تثبيت التبعيات'
        run: npm ci --prefer-offline

      - name: '📦 تثبيت تبعيات الأخبار'
        run: npm install --no-save rss-parser cheerio axios

      - name: '🤖 تشغيل محرك الأخبار — Tier 2'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          NODE_ENV: production
        run: node scripts/news-automation/auto-news-worker.js --tier=2

      - name: '📡 تشغيل محرك الفهرسة'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NODE_ENV: production
        run: node scripts/news-automation/indexing-process.js

      - name: '💾 حفظ ونشر المقالات في Git'
        run: |
          git config user.name "Raqmana News Bot"
          git config user.email "bot@raqmanadz.com"
          git add lib/custom-articles-data.json public/auto-news-sitemap.xml scripts/news-automation/history.json || true
          git diff --staged --quiet || git commit -m "🌙 auto: Tier2 daily articles $(date +'%Y-%m-%d')"
          git push || echo "لا توجد تغييرات لرفعها"

  # ════════════════════════════════════════════════════════════
  # JOB 4 — رادار مسابقات التوظيف والفهرسة الفورية (كل 3 ساعات)
  # ════════════════════════════════════════════════════════════
  jobs-radar:
    name: '💼 رادار مسابقات التوظيف والأرشفة الفورية'
    runs-on: ubuntu-latest

    # تشغيل عند Cron 1, Cron 2, أو يدوياً بـ jobs أو all
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'jobs' || github.event.inputs.job_type == 'all')) ||
      (github.event_name == 'schedule')

    steps:
      - name: '📥 Checkout المستودع'
        uses: actions/checkout@v4

      - name: '🟢 إعداد Node.js 20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: '⚡ تشغيل رادار مسابقات التوظيف والأرشفة الفورية'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NODE_ENV: production
        run: node scripts/scrape-concours.mjs

      - name: '💾 حفظ وتحديث مسابقات التوظيف في Git'
        run: |
          git config user.name "Raqmana Jobs Bot"
          git config user.email "bot@raqmanadz.com"
          git add lib/official-concours-data.json || true
          git diff --staged --quiet || git commit -m "💼 auto: New job competitions & instant indexing $(date +'%Y-%m-%d %H:%M')"
          git push || echo "لا توجد مسابقات جديدة لرفعها"


